<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1f1800" />
      <stop offset="100%" stop-color="#0a0800" />
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cfb05b" />
      <stop offset="25%" stop-color="#fff8d6" />
      <stop offset="50%" stop-color="#c99f36" />
      <stop offset="75%" stop-color="#ffec9c" />
      <stop offset="100%" stop-color="#b0831c" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)" />

  <!-- Outer border -->
  <rect x="16" y="16" width="480" height="480" rx="20" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.4" />

  <!-- "REDDY" Text -->
  <text x="256" y="210" font-family="Times-Roman, serif" font-size="120" font-weight="bold" fill="url(#gold)" text-anchor="middle" letter-spacing="4">REDDY</text>

  <!-- "MATKA" Text inside a small box -->
  <rect x="156" y="225" width="200" height="46" rx="6" fill="#111" stroke="url(#gold)" stroke-width="2" />
  <text x="256" y="259" font-family="Times-Roman, serif" font-size="32" font-weight="bold" fill="url(#gold)" text-anchor="middle" letter-spacing="6">MATKA</text>

  <!-- Line -->
  <line x1="90" y1="320" x2="422" y2="320" stroke="url(#gold)" stroke-width="2" />

  <!-- "SINCE 2010" -->
  <text x="256" y="360" font-family="Times-Roman, serif" font-size="30" fill="url(#gold)" text-anchor="middle" letter-spacing="4">SINCE 2010</text>

  <!-- Website Pill -->
  <rect x="80" y="390" width="352" height="44" rx="22" fill="none" stroke="url(#gold)" stroke-width="2" />
  <text x="256" y="420" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="url(#gold)" text-anchor="middle" letter-spacing="3">WWW.REDDYMATKA.COM</text>

</svg>
